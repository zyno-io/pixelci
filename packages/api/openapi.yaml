openapi: 3.1.0
jsonSchemaDialect: https://spec.openapis.org/oas/3.1/dialect/base
info:
  title: "@zyno-io/pixelci-api"
  version: 0.8.0
paths:
  /api/session/me:
    get:
      operationId: getSessionGetIdentity
      tags:
        - session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISessionResponse"
  /api/session/providers:
    get:
      operationId: getSessionGetProviders
      tags:
        - session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ISessionProvider"
  /api/session/build-provider:
    get:
      operationId: getSessionGetBuildProvider
      tags:
        - session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISessionProvider"
      summary: The provider that owns a build's app, so a review link can skip the
        provider picker. Unauthenticated, so it answers only when the build ID
        and app ID match (both unguessable), and the same 404 for every miss.
      parameters:
        - name: appId
          in: query
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: buildId
          in: query
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
  /api/session/providers/{id}/login-url:
    get:
      operationId: getSessionGetProviderLoginUrl
      tags:
        - session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISessionLoginUrlResponse"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
  /api/session/onboarding-status:
    get:
      operationId: getSessionGetOnboardingStatus
      tags:
        - session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IOnboardingStatusResponse"
  /api/session/onboarding/vcs-integration:
    post:
      operationId: postSessionCreateOnboardingVcsIntegration
      tags:
        - session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PickVcsIntegrationEntity"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IOnboardingRequest"
  /api/session/login:
    post:
      operationId: postSessionLogin
      tags:
        - session
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ISessionLoginResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ISessionLoginRequest"
  /api/apps:
    get:
      operationId: getAppsIndex
      tags:
        - apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IAppIndexResponse"
    post:
      operationId: postAppsCreate
      tags:
        - apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAppIndexResponse"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IAppCreateInput"
  /api/apps/{id}:
    get:
      operationId: getAppsShow
      tags:
        - apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAppShowResponse"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
    put:
      operationId: putAppsUpdate
      tags:
        - apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAppIndexResponse"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IAppUpdateInput"
    delete:
      operationId: deleteAppsDelete
      tags:
        - apps
      responses:
        "200":
          description: OK
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
  /api/apps/{id}/masks:
    put:
      operationId: putAppsUpdateMasks
      tags:
        - apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAppMasksResponse"
      summary: "Replaces the app's masks, which apply to every screen that doesn't opt
        out. Admin-only: they blank regions of every screen."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                masks:
                  type: array
                  items:
                    $ref: "#/components/schemas/IMaskRect"
                baseVersion:
                  type: number
              required:
                - masks
                - baseVersion
  /api/apps/vcs-projects/search:
    get:
      operationId: getAppsSearchVcsProjects
      tags:
        - apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IVcsProject"
      parameters:
        - name: vcsId
          in: query
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: search
          in: query
          required: true
          schema:
            type: string
  /api/apps/vcs-projects/resolve:
    get:
      operationId: getAppsResolveVcsProject
      tags:
        - apps
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IVcsProject"
      parameters:
        - name: vcsId
          in: query
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: url
          in: query
          required: true
          schema:
            type: string
  /api/apps/{appId}/branches:
    get:
      operationId: getBranchesIndex
      tags:
        - branches
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IBranchResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
  /api/apps/{appId}/builds:
    get:
      operationId: getBuildsIndex
      tags:
        - builds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IBuildResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: branchId
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: limit
          in: query
          required: false
          schema:
            type: number
        - name: before
          in: query
          required: false
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
    post:
      operationId: postBuildsCreate
      tags:
        - builds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IBuildCreateResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                projectUrl:
                  type: string
                screens:
                  type: object
                  properties:
                    count:
                      type: number
                    hash:
                      type: string
                  required:
                    - count
                    - hash
                runId:
                  type: string
                shard:
                  type: object
                  properties:
                    index:
                      type: number
                    total:
                      type: number
                  required:
                    - index
                    - total
                commit:
                  type: object
                  properties:
                    subject:
                      type: string
                    author:
                      type: string
                    mergeRequest:
                      type: object
                      properties:
                        iid:
                          type: string
                        eventType:
                          type: string
  /api/apps/{appId}/builds/{id}:
    get:
      operationId: getBuildsGet
      tags:
        - builds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IBuildDetailResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
  /api/apps/{appId}/builds/{id}/status:
    get:
      operationId: getBuildsShow
      tags:
        - builds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IBuildBasicResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
  /api/apps/{appId}/builds/{id}/process:
    post:
      operationId: postBuildsProcess
      tags:
        - builds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                screens:
                  type: object
                  properties:
                    count:
                      type: number
                    hash:
                      type: string
                  required:
                    - count
                    - hash
                base:
                  $ref: "#/components/schemas/IBase"
  /api/apps/{appId}/builds/{id}/approve:
    post:
      operationId: postBuildsApprove
      tags:
        - builds
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IBuildApprovalResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
  /api/apps/{appId}/builds/{id}/screens:
    get:
      operationId: getBuildScreensGetScreens
      tags:
        - buildScreens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IBuildScreenResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
    post:
      operationId: postBuildScreensUploadScreen
      tags:
        - buildScreens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IBuildScreenCreateResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  x-maxSizeBytes: 17825792
                name:
                  type: string
              required:
                - image
  /api/apps/{appId}/builds/{id}/screens/{screenId}/compare:
    post:
      operationId: postBuildScreensCompareScreen
      tags:
        - buildScreens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IBuildScreenCompareResponse"
      summary: Previews a comparison of this build's screen against the reference
        build's screen with arbitrary tolerances. Writes nothing.
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                colorTolerance:
                  type: number
                shiftTolerance:
                  type: number
                diffPctTolerance:
                  type: number
                masks:
                  type: array
                  items:
                    $ref: "#/components/schemas/IMaskRect"
              required:
                - colorTolerance
                - shiftTolerance
                - diffPctTolerance
                - masks
  /api/apps/{appId}/builds/{id}/screens/{screenId}/image:
    get:
      operationId: getBuildScreensGetScreenImage
      tags:
        - buildScreens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
  /api/apps/{appId}/builds/{id}/screens/{screenId}/thumbnail:
    get:
      operationId: getBuildScreensGetScreenThumbnail
      tags:
        - buildScreens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      summary: A scaled-down copy of the screenshot for gallery tiles, generated on
        first request and kept in storage.
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
  /api/apps/{appId}/builds/{id}/screens/{screenId}/diff:
    get:
      operationId: getBuildScreensGetScreenDiff
      tags:
        - buildScreens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {}
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
  /api/apps/{appId}/builds/{id}/screens/{screenId}/review:
    post:
      operationId: postBuildScreensReviewScreen
      tags:
        - buildScreens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IBuildScreenReviewResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reviewStatus:
                  enum:
                    - approved
                    - rejected
                  type: string
                comment:
                  type: string
              required:
                - reviewStatus
                - comment
  /api/apps/{appId}/screens:
    get:
      operationId: getScreensIndex
      tags:
        - screens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IAppGalleryResponse"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
  /api/apps/{appId}/screens/{screenId}/tolerances:
    put:
      operationId: putScreensUpdateTolerances
      tags:
        - screens
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IToleranceOverrides"
      parameters:
        - name: appId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
        - name: screenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
            pattern: ^[0-9a-fA-F]{8}-(?:[0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IToleranceOverrides"
  /api/apps/{appId}/screens/{screenId}/masks:
    put:
      operationId: putScreensUpdateMasks
      tags:
        - screens
      responses:
        "200":
          description: OK
          content:
