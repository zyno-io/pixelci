# Container image, e.g. gcr.s24.dev/signal24/products/pixelci:26.615.1432-abc123.
# Typically passed at deploy time via `--set image=...`.
image: ''

# Application version label, surfaced on Pod metadata for observability.
# Typically passed at deploy time via `--set version=...`.
version: ''

replicas: 1

worker:
  replicas: 1

ingress:
  enabled: true
  host: pixelci.s24.dev
  annotations:
    nginx.ingress.kubernetes.io/cors-allow-methods: GET, POST
    nginx.ingress.kubernetes.io/cors-allow-origin: http://localhost:5173
    nginx.ingress.kubernetes.io/cors-allow-credentials: 'true'
    nginx.ingress.kubernetes.io/enable-cors: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
  tls:
    enabled: true
    secretName: s24dev-wildcard-tls

env:
  APP_ENV: production
  USE_REAL_IP_HEADER: 'true'

  REDIS_SENTINEL_HOST: redis.redis.svc.cluster.local
  REDIS_SENTINEL_NAME: redis
  REDIS_PREFIX: pixelci

  # CNPG pg-production via its PgBouncer pooler (transaction mode). The CNPG CA
  # isn't in Node's trust store, so TLS is on without certificate verification.
  PG_HOST: pg-production-pooler.db.svc.cluster.local
  PG_PORT: '5432'
  PG_USER: pixelci
  PG_DATABASE: pixelci
  PG_SSL: 'true'
  PG_SSL_REJECT_UNAUTHORIZED: 'false'

  S3_ENDPOINT: https://s3.us-east-va.io.cloud.ovh.us
  S3_REGION: us-east-va
  S3_BUCKET: s24-pixelci

# Environment variables sourced from Secret or ConfigMap keys, e.g.
#   REDIS_PASSWORD_SECRET:
#     secretKeyRef: { name: pixelci-redis-auth, key: password }
envValueFrom:
  # Hemlig-imported CNPG role credential (workloads/trusted/database/pixelci-postgres-role).
  PG_PASSWORD_SECRET:
    secretKeyRef: { name: pixelci-postgres-role, key: password }

secret:
  # Name of the Kubernetes Secret to mount into the containers as env vars.
  # Defaults to the release name when unset; here it matches the Hemlig secret import.
  name: pixelci-envsecrets

  # Set `values` to have the chart create the Secret for you.
  # Leave commented to mount an existing Secret with `name` above.
  # values:

resources: {}
