# Container image, e.g. ghcr.io/zyno-io/pixelci:0.8.0. Required.
image: ''

# Application version label, surfaced on Pod metadata for observability.
version: ''

# imagePullSecrets:
#   - name: my-registry

# API server (UI + API on port 7924).
replicas: 1

# Sized from production peaks (~250 MiB working set, < 0.1 CPU).
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 768Mi

worker:
  replicas: 1
  # Lets an in-flight comparison finish before the pod is killed.
  terminationGracePeriodSeconds: 600
  # Comparisons decode full screenshots, so the worker needs the most memory
  # (production peaks ~750 MiB). Raise the limit for very large screenshots.
  resources:
    requests:
      cpu: 250m
      memory: 768Mi
    limits:
      memory: 2Gi

# Pre-install/pre-upgrade migration job.
migration:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

ingress:
  enabled: true
  # Required when the ingress is enabled; must match the host in PUBLIC_URL.
  host: ''
  annotations:
    # Screenshot uploads are up to 16 MB.
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
  tls:
    enabled: false
    secretName: ''

# Plain environment variables. See docs/deployment.md for the full reference.
env:
  APP_ENV: production
  # Public origin of the web app, e.g. https://pixelci.example.com. Required;
  # the OAuth redirect URI is always ${PUBLIC_URL}/login.
  PUBLIC_URL: ''
  # REDIS_HOST: redis
  # REDIS_PREFIX: pixelci
  # PG_HOST: postgres
  # PG_USER: pixelci
  # PG_DATABASE: pixelci
  # S3_ENDPOINT: https://s3.amazonaws.com
  # S3_REGION: us-east-1
  # S3_BUCKET: pixelci

# Environment variables sourced from Secret or ConfigMap keys, e.g.
#   PG_PASSWORD_SECRET:
#     secretKeyRef: { name: pixelci-postgres, key: password }
envValueFrom: {}

secret:
  # Name of the Kubernetes Secret mounted into every container as env vars
  # (CRYPTO_SECRET, AUTH_JWT_SECRET, SETUP_TOKEN, S3 keys, passwords).
  # Defaults to the release name.
  name: ''

  # Set `values` to have the chart create the Secret. Leave unset to mount an
  # existing Secret named above.
  # values:
  #   CRYPTO_SECRET: ...
