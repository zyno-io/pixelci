{{- if .Values.secret.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name | default .Release.Name }}
  annotations:
    # The migration job is a pre-install hook, so the Secret it mounts must
    # exist before it: create it as an earlier hook.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{- range $k, $v := .Values.secret.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
