services:
  postgres:
    image: postgres:18
    container_name: pixelci-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: pixelci
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U root -d pixelci']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: pixelci-redis
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  s3:
    image: chrislusf/seaweedfs:latest
    container_name: pixelci-s3
    ports:
      - '29444:8333'
    command: 'server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -volume.minFreeSpace=100M'
    volumes:
      - s3-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:9333/cluster/status']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  s3-data:
